[project]
name = "vectordb"
version = "0.1.0"
description = "A vector database built from scratch: brute-force, IVF, and HNSW indexes with metadata filtering, persistence, and a REST API."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vectordb*"]
